<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siberdeyz IPTV</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen">
      <form id="loginForm" class="login-box">
        <p class="eyebrow">Siberdeyz</p>
        <h1>Admin Girisi</h1>
        <input id="adminPasswordInput" type="password" inputmode="numeric" placeholder="Admin sifresi" autocomplete="current-password" />
        <button id="loginButton" type="submit">Giris Yap</button>
        <p id="loginStatus" class="source-status">Ana panele gecmek icin sifre girin.</p>
      </form>
    </section>

    <main id="appShell" class="tv-shell" hidden>
      <header class="tv-header">
        <div>
          <p class="eyebrow">Siberdeyz</p>
          <h1>Yayin Sistemi</h1>
        </div>
        <div class="header-status">
          <span id="sourceStatus">Yayin kaynagi kontrol ediliyor...</span>
          <button id="refreshButton" type="button">Yenile</button>
        </div>
      </header>

      <section class="watch-area">
        <video id="player" controls playsinline></video>
        <div class="player-meta">
          <span>Secili yayin</span>
          <strong id="currentChannel">Henuz secilmedi</strong>
        </div>
      </section>

      <section id="bottomPanel" class="bottom-panel" data-open="channels">
        <div class="panel-handle"></div>

        <div id="channelsView" class="panel-view">
          <div class="filters">
            <input id="searchInput" type="search" placeholder="Kanal ara" />
            <select id="typeSelect" aria-label="Yayin turu sec">
              <option value="all">Tumu</option>
              <option value="live">Canli TV</option>
              <option value="movie">Film</option>
              <option value="series">Dizi</option>
            </select>
            <select id="groupSelect" aria-label="Kategori sec"></select>
            <label class="checkbox-line">
              <input id="favoritesOnlyInput" type="checkbox" />
              Sadece favoriler
            </label>
          </div>
          <div id="status" class="status">Yayin listesi yukleniyor...</div>
          <div id="channelList" class="channel-list"></div>
          <button id="loadMoreButton" class="load-more" type="button" hidden>Daha fazla goster</button>
        </div>

        <div id="settingsView" class="panel-view" hidden>
          <div class="source-manager">
            <label for="sourceInput">Yayin URL</label>
            <div class="source-row">
              <input id="sourceInput" type="url" placeholder="http://.../get.php?username=...&password=...&type=m3u_plus" />
              <button id="saveSourceButton" type="button">Yukle</button>
              <button id="deleteSourceButton" class="danger-button" type="button">Sil</button>
            </div>
          </div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Ana kontroller">
        <button class="nav-button is-active" type="button" data-panel="channels">
          <span>Kanal</span>
        </button>
        <button class="nav-button" type="button" data-panel="settings">
          <span>Ayar</span>
        </button>
        <button class="nav-button" type="button" data-action="fullscreen">
          <span>Tam Ekran</span>
        </button>
      </nav>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>

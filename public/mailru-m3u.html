<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070b"><title>Mail.ru → M3U | Siberdeyz</title>
<style>body{margin:0;background:#05070b;color:#eef2f7;font:16px system-ui;padding:24px}.box{max-width:720px;margin:auto;background:#0d131c;border:1px solid #243142;border-radius:20px;padding:22px}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #334155;font-size:16px}input{background:#080d14;color:white;margin:12px 0}button{background:#22c55e;color:#031108;font-weight:800;cursor:pointer}.status{white-space:pre-wrap;margin-top:16px;color:#cbd5e1}.result{margin-top:18px;padding:14px;background:#080d14;border-radius:12px}.result a{color:#4ade80;word-break:break-all}.secondary{margin-top:10px;background:#172033;color:#fff}</style></head>
<body><div class="box"><h1>Mail.ru → M3U</h1><p>Mail.ru video veya embed linkini yapistir. Sistem gercek medya adresini bulup M3U olusturur.</p>
<input id="url" type="url" placeholder="https://my.mail.ru/mail/.../video/.../....html"><button id="go">Yayini Bul</button><div id="status" class="status"></div><div id="result"></div></div>
<script>
const url=document.querySelector('#url'),status=document.querySelector('#status'),result=document.querySelector('#result');
document.querySelector('#go').onclick=async()=>{result.innerHTML='';status.textContent='Araniyor...';try{const r=await fetch('/api/mailru-m3u/resolve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:url.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Islem basarisiz');status.textContent='Bulundu: '+d.title+' | '+d.videos.length+' kalite';const box=document.createElement('div');box.className='result';const a=document.createElement('a');a.href=d.best.url;a.textContent=d.best.quality+' - Gercek yayin adresi';a.target='_blank';const b=document.createElement('button');b.className='secondary';b.textContent='M3U Indir';b.onclick=()=>{const blob=new Blob([d.m3u],{type:'audio/x-mpegurl'});const x=document.createElement('a');x.href=URL.createObjectURL(blob);x.download='mailru-'+d.videoId+'.m3u';x.click();setTimeout(()=>URL.revokeObjectURL(x.href),1000)};box.append(a,b);result.append(box)}catch(e){status.textContent='Hata: '+e.message}};
</script></body></html>

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <title>Siberdeyz IPTV Offline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <style>
      :root { color-scheme: dark; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: calc(18px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px));
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 10%, rgba(34, 197, 94, .2), transparent 32%), #05070b;
        color: #f8fafc;
      }
      main {
        width: min(100%, 420px);
        padding: 24px;
        border: 1px solid rgba(148, 163, 184, .22);
        border-radius: 12px;
        background: rgba(13, 19, 32, .92);
        box-shadow: 0 20px 70px rgba(0, 0, 0, .38);
      }
      img { width: 74px; height: 74px; border-radius: 18px; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.1; }
      p { margin: 0 0 18px; color: #a7b2c2; line-height: 1.45; }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 13px 14px;
        background: linear-gradient(135deg, #22c55e, #86efac);
        color: #052e16;
        font: inherit;
        font-weight: 850;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Baglanti yok</h1>
      <p>Uygulama acilir ama yayin listesi ve video oynatma icin internet gerekir. Baglanti gelince tekrar deneyin.</p>
      <button type="button" onclick="location.reload()">Tekrar Dene</button>
    </main>
  </body>
</html>

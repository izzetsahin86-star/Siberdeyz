<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Siberdeyz mobil IPTV yayin merkezi." />
    <meta name="application-name" content="Siberdeyz IPTV" />
    <meta name="apple-mobile-web-app-title" content="Siberdeyz" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Siberdeyz IPTV</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="mask-icon" href="/icons/mask-icon.svg" color="#22c55e" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen">
      <form id="loginForm" class="login-box">
        <p class="eyebrow">Siberdeyz</p>
        <h1>Admin Girisi</h1>
        <input id="adminPasswordInput" type="password" inputmode="numeric" placeholder="Admin sifresi" autocomplete="current-password" />
        <button id="loginButton" type="submit">Giris Yap</button>
        <p id="loginStatus" class="source-status">Ana panele gecmek icin sifre girin.</p>
      </form>
    </section>

    <main id="appShell" class="tv-shell" hidden>
      <header class="app-header">
        <div class="brand-block">
          <p class="eyebrow">Siberdeyz</p>
          <h1>Yayin Merkezi</h1>
        </div>
        <span id="headerSourceStatus" class="source-pill">Liste kontrol ediliyor...</span>
      </header>

      <section class="group-panel" aria-label="Yayin gruplari">
        <div class="type-strip" aria-label="Yayin turleri">
          <button class="group-chip is-active" type="button" data-type-filter="all">Tumu</button>
          <button class="group-chip" type="button" data-type-filter="live">Canli TV</button>
          <button class="group-chip" type="button" data-type-filter="movie">Film</button>
          <button class="group-chip" type="button" data-type-filter="series">Dizi</button>
          <button class="group-chip favorite-chip" type="button" data-favorites-filter="1">Favoriler</button>
        </div>
        <div id="groupChips" class="group-strip" aria-label="Kategoriler"></div>
      </section>

      <section class="watch-area">
        <video id="player" controls playsinline muted></video>
        <div class="player-meta">
          <span>Secili yayin</span>
          <strong id="currentChannel">Henuz secilmedi</strong>
        </div>
      </section>

      <section class="control-panel" aria-label="Ana kontroller">
        <button class="control-button is-active" type="button" data-panel="channels">Kanallar</button>
        <button class="control-button" type="button" data-panel="settings">Ayarlar</button>
        <button class="control-button" type="button" data-action="fullscreen">Tam Ekran</button>
        <button id="refreshButton" class="control-button" type="button">Yenile</button>
      </section>

      <section id="bottomPanel" class="content-panel" data-open="channels" data-compact="false">
        <div id="channelsView" class="panel-view">
          <div class="search-row">
            <input id="searchInput" type="search" placeholder="Kanal, film veya dizi ara" />
          </div>
          <div id="status" class="status">Yayin listesi yukleniyor...</div>
          <div id="channelList" class="channel-list"></div>
          <button id="loadMoreButton" class="load-more" type="button" hidden>Daha fazla goster</button>
        </div>

        <div id="settingsView" class="panel-view" hidden>
          <div class="settings-grid">
            <section class="setting-card">
              <div>
                <h2>Ses Ayari</h2>
                <p id="soundStatus">Video her acilista sessiz baslar.</p>
              </div>
              <label class="switch-line">
                <input id="soundToggleInput" type="checkbox" />
                <span>Sesi ac</span>
              </label>
            </section>

            <section class="setting-card">
              <div>
                <h2>Liste Yukleme</h2>
                <p id="sourceStatus" class="source-status">Yayin kaynagi kontrol ediliyor...</p>
              </div>
              <div class="source-row">
                <input id="sourceInput" type="url" placeholder="http://.../get.php?username=...&password=...&type=m3u_plus" />
                <button id="saveSourceButton" type="button">Yukle</button>
                <button id="deleteSourceButton" class="danger-button" type="button">Sil</button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>

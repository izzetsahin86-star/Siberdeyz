<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Siberdeyz mobil IPTV yayin merkezi." />
    <meta name="application-name" content="Siberdeyz IPTV" />
    <meta name="apple-mobile-web-app-title" content="Siberdeyz" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Siberdeyz IPTV</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="mask-icon" href="/icons/mask-icon.svg" color="#22c55e" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen">
      <form id="loginForm" class="login-box">
        <p class="eyebrow">Siberdeyz</p>
        <h1>Admin Girisi</h1>
        <input id="adminPasswordInput" type="password" inputmode="numeric" placeholder="Admin sifresi" autocomplete="current-password" />
        <button id="loginButton" type="submit">Giris Yap</button>
        <p id="loginStatus" class="source-status" hidden></p>
      </form>
    </section>

    <main id="appShell" class="tv-shell" hidden>
      <header class="app-header">
        <div class="brand-block">
          <p class="eyebrow">Siberdeyz</p>
        </div>
      </header>

      <section class="group-panel" aria-label="Kategoriler">
        <button id="categoryToggle" class="category-toggle" type="button" aria-expanded="false" aria-controls="groupChips">
          <span class="category-toggle-label">Kategori</span>
          <strong id="currentGroupLabel">Tumu</strong>
          <span class="category-toggle-chevron" aria-hidden="true">⌄</span>
        </button>
        <div id="groupChips" class="group-strip" aria-label="Kategoriler" hidden></div>
      </section>

      <section class="watch-area">
        <video id="player" controls playsinline muted></video>

        <div id="playbackTimeline" class="playback-timeline" hidden aria-hidden="true">
          <span id="playbackCurrentTime">00:00</span>
          <span class="playback-timeline-track"><i id="playbackProgressFill"></i></span>
          <span id="playbackDurationTime">--:--</span>
        </div>

        <div class="player-meta">
          <span>Secili yayin</span>
          <strong id="currentChannel">Henuz secilmedi</strong>
        </div>
      </section>

      <section id="bottomPanel" class="content-panel" data-open="none" data-compact="false" aria-hidden="true">
        <div class="sheet-header">
          <strong id="panelTitle">Kanallar</strong>
          <button id="closePanelButton" class="sheet-close" type="button" aria-label="Paneli kapat">Kapat</button>
        </div>

        <div class="sheet-body">
          <div id="channelsView" class="panel-view channels-view">
            <div class="channel-toolbar">
              <input id="searchInput" type="search" placeholder="Kanal ara" />
              <select id="channelCategorySelect" aria-label="Kategori sec">
                <option value="Tumu">Tumu</option>
              </select>
            </div>
            <div id="status" class="status channel-status">Yayin listesi yukleniyor...</div>
            <div id="channelList" class="channel-list compact-channel-list"></div>
            <button id="loadMoreButton" class="load-more compact-load-more" type="button" hidden>Daha fazla goster</button>
          </div>

          <div id="accountsView" class="panel-view accounts-view" hidden>
            <div id="sourceStatus" class="source-status" hidden></div>
            <div class="source-tools">
              <div class="source-action-row">
                <label class="file-upload-card">
                  <input id="sourceFileInput" type="file" accept=".m3u,.m3u8,.txt,application/vnd.apple.mpegurl,audio/x-mpegurl,text/plain" multiple />
                  <span>Dosya Ekle</span>
                  <small>M3U / TXT</small>
                </label>
                <button id="toggleUrlFormButton" class="pill-action-button" type="button">URL Ekle</button>
              </div>
              <div id="sourceUrlForm" class="source-url-form" hidden>
                <input id="sourceNameInput" type="text" placeholder="Hesap adi" autocomplete="off" />
                <input id="sourceInput" type="url" placeholder="Yayin liste URL" />
                <button id="saveSourceButton" type="button">Kaydet</button>
              </div>
            </div>
            <div class="account-list-head">
              <div class="account-list-title">
                <strong>Hesaplarim</strong>
                <span id="accountCount" class="account-count">0</span>
              </div>
              <div class="account-head-actions">
                <button id="scanAllAccountsButton" class="scan-all-accounts" type="button" hidden>Hesaplari Tara</button>
                <button id="deleteAllSourcesButton" class="delete-all-sources" type="button" hidden>Hepsini Sil</button>
              </div>
            </div>

            <div class="account-search-row">
              <input id="accountSearchInput" type="search" placeholder="Hesap ara..." autocomplete="off" />
              <select id="accountStatusFilter" aria-label="Hesap durumu">
                <option value="all">Tumu</option>
                <option value="active">Aktif</option>
                <option value="expired">Suresi biten</option>
                <option value="failed">Calismayan</option>
                <option value="unscanned">Taranmamis</option>
              </select>
            </div>

            <div id="accountScanSummary" class="account-scan-summary">
              <span data-account-stat="active">Aktif 0</span>
              <span data-account-stat="expired">Suresi biten 0</span>
              <span data-account-stat="failed">Calismayan 0</span>
              <span data-account-stat="unscanned">Taranmamis 0</span>
            </div>

            <div id="sourceList" class="source-list"></div>
            <div id="accountRenderHint" class="account-render-hint" hidden></div>
          </div>

          <div id="settingsView" class="panel-view settings-view" hidden>
            <div class="settings-grid">
              <section class="setting-card">
                <div>
                  <h2>Ses Ayari</h2>
                  <p id="soundStatus">Video her acilista sessiz baslar.</p>
                </div>
                <label class="switch-line">
                  <input id="soundToggleInput" type="checkbox" />
                  <span>Sesi ac</span>
                </label>
              </section>
            </div>
          </div>
        </div>
      </section>

      <section class="control-panel" aria-label="Ana kontroller">
        <button class="control-button" type="button" data-action="stop">Yayini Kapat</button>
        <button class="control-button" type="button" data-action="next">Sonraki</button>
        <button class="control-button" type="button" data-action="reload">Yenile</button>
        <button class="control-button" type="button" data-panel="channels">Kanallar</button>
        <button class="control-button" type="button" data-panel="accounts">Hesaplar</button>
        <button class="control-button" type="button" data-panel="settings">Ayarlar</button>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
